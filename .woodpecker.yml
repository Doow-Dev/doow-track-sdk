when:
  - event: [push, pull_request, tag]

concurrency:
  limit: 1
  group: doow-track-sdk-${CI_COMMIT_BRANCH}

steps:
  - name: setup
    image: node:22
    commands:
      - npm ci
      - git fetch --unshallow origin || git fetch origin main --depth=200 || true

  - name: lint
    image: node:22
    commands:
      - npm run lint
    depends_on:
      - setup

  - name: typecheck
    image: node:22
    commands:
      - npm run typecheck
    depends_on:
      - setup

  - name: build
    image: node:22
    commands:
      - npm run build
    depends_on:
      - setup

  - name: test
    image: node:22
    commands:
      - npm test
    depends_on:
      - build

  - name: publish-npm
    image: node:22
    commands:
      - |
        echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" > ~/.npmrc
        npm publish --access public
    environment:
      NPM_TOKEN:
        from_secret: npm_token
    depends_on:
      - test
      - lint
      - typecheck
    when:
      - event: tag
        ref: refs/tags/sdk/v*

  - name: docker-build
    image: woodpeckerci/plugin-docker-buildx
    privileged: true
    settings:
      repo: ghcr.io/doow-dev/doow-track-sidecar
      dockerfile: Dockerfile
      registry: ghcr.io
      platforms: linux/amd64,linux/arm64
      tags:
        - latest
        - ${CI_COMMIT_TAG##sdk/v}
      username:
        from_secret: ghcr_username
      password:
        from_secret: ghcr_token
    depends_on:
      - test
      - lint
      - typecheck
    when:
      - event: tag
        ref: refs/tags/sdk/v*
