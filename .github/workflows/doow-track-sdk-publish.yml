name: doow-track — Test, Build, Publish

on:
  push:
    tags:
      - 'typescript-v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GHCR_LOGIN_SERVER: ghcr.io
  GHCR_IMAGE_NAME: doow-dev/doow-track-sidecar
defaults:
  run:
    working-directory: .

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['18.x', '20.x', '22.x']
      fail-fast: false

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --workspace @doow/track

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Verify npm package excludes standalone runtimes
        run: |
          npm pack --dry-run --json --workspace @doow/track > "$RUNNER_TEMP/npm-pack.json"
          node -e 'const pkg = require("./sdks/typescript/package.json"); const files = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))[0].files.map(({ path }) => path); const excluded = ["dist/cli.cjs", "dist/sidecar.cjs"]; if (pkg.bin || excluded.some((path) => files.includes(path))) throw new Error("The npm SDK package must not expose or include standalone runtimes.");' "$RUNNER_TEMP/npm-pack.json"

      - name: Test
        run: npm run test --workspace @doow/track

  verify-version:
    name: Verify release tag version
    if: startsWith(github.ref, 'refs/tags/typescript-v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Compare tag and package versions
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/typescript-v}"
          PACKAGE_VERSION="$(node -p "require('./sdks/typescript/package.json').version")"
          if [[ ! "${TAG_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag version ${TAG_VERSION} must be X.Y.Z. Prerelease and build suffixes would take the latest tags, so they are not published." >&2
            exit 1
          fi
          if [[ "${TAG_VERSION}" != "${PACKAGE_VERSION}" ]]; then
            echo "Tag version ${TAG_VERSION} does not match SDK package version ${PACKAGE_VERSION}." >&2
            exit 1
          fi

  build-docker:
    name: Build sidecar image
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build SDKs
        run: npm run build

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build sidecar image for the smoke test
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: sdks/typescript/Dockerfile
          load: true
          push: false
          tags: doow-sidecar-smoke
          build-args: |
            SDK_VERSION=smoke

      - name: Smoke test the sidecar image
        run: |
          trap 'docker rm -f sidecar-smoke >/dev/null 2>&1 || true' EXIT
          docker rm -f sidecar-smoke >/dev/null 2>&1 || true
          docker run -d --name sidecar-smoke \
            -e DOOW_TRACK_API_KEY=dk_smoke \
            -e DOOW_TRACK_DISABLED=true \
            -e DOOW_TRACK_INPUT=tcp:9091 \
            -p 19090:9090 doow-sidecar-smoke
          healthy=false
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:19090/healthz | grep -q '"status":"ok"'; then healthy=true; break; fi
            sleep 1
          done
          if [[ "${healthy}" != "true" ]]; then
            docker logs sidecar-smoke >&2
            exit 1
          fi
          docker stop -t 10 sidecar-smoke
          test "$(docker inspect -f '{{.State.ExitCode}}' sidecar-smoke)" = "0"

      - name: Verify multi-arch sidecar image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: sdks/typescript/Dockerfile
          push: false
          platforms: linux/amd64,linux/arm64
          build-args: |
            SDK_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # npm runs last: a published npm version can never be reused, while an image tag or a
  # GitHub release can be corrected, so everything reversible has to succeed first.
  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [test, verify-version, build-docker, build-cli, smoke-windows, publish-docker, release]
    if: startsWith(github.ref, 'refs/tags/typescript-v')

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js 20 (npm publish)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish
        run: npm publish --workspace @doow/track --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-docker:
    name: Publish sidecar Docker image
    runs-on: ubuntu-latest
    needs: [test, verify-version, build-docker, build-cli, smoke-windows]
    if: startsWith(github.ref, 'refs/tags/typescript-v')
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/typescript-v}"
          MAJOR="${VERSION%%.*}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "major=${MAJOR}" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.GHCR_LOGIN_SERVER }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push sidecar image (multi-arch)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: sdks/typescript/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.GHCR_LOGIN_SERVER }}/${{ env.GHCR_IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.GHCR_LOGIN_SERVER }}/${{ env.GHCR_IMAGE_NAME }}:${{ steps.version.outputs.major }}
            ${{ env.GHCR_LOGIN_SERVER }}/${{ env.GHCR_IMAGE_NAME }}:latest
          build-args: |
            SDK_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-cli:
    name: Build and smoke test ${{ matrix.target }} CLI
    needs: test

    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: linux-x64
            pkg_target: node24-linux-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
            pkg_target: node24-linux-arm64
          - runner: macos-15-intel
            target: darwin-x64
            pkg_target: node24-macos-x64
          - runner: macos-latest
            target: darwin-arm64
            pkg_target: node24-macos-arm64
          - runner: ubuntu-latest
            target: windows-x64.exe
            pkg_target: node24-win-x64

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.x'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package CLI binary
        run: |
          BINARY_NAME="doow-track-${{ matrix.target }}"
          npx --no-install pkg sdks/typescript/dist/cli.cjs --target "${{ matrix.pkg_target }}" --output "${BINARY_NAME}"
          if [[ "${BINARY_NAME}" != *.exe ]]; then chmod +x "${BINARY_NAME}"; fi
          if command -v sha256sum >/dev/null; then
            sha256sum "${BINARY_NAME}" > "${BINARY_NAME}.sha256"
          else
            shasum -a 256 "${BINARY_NAME}" > "${BINARY_NAME}.sha256"
          fi

      - name: Smoke test native CLI binary
        if: matrix.target != 'windows-x64.exe'
        run: |
          BINARY_NAME="doow-track-${{ matrix.target }}"
          EXPECTED_VERSION="doow-track v$(node -p "require('./sdks/typescript/package.json').version")"
          if command -v sha256sum >/dev/null; then
            sha256sum -c "${BINARY_NAME}.sha256"
          else
            shasum -a 256 -c "${BINARY_NAME}.sha256"
          fi
          test "$("./${BINARY_NAME}" --version)" = "${EXPECTED_VERSION}"
          "./${BINARY_NAME}" --help | grep -q 'Usage: doow-track'
          printf '{"metric":"release_smoke","quantity":1,"license_id":"lic_smoke"}\n' | env DOOW_TRACK_DISABLED=true "./${BINARY_NAME}" --api-key dk_smoke

      - name: Upload CLI binary artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cli-${{ matrix.target }}
          path: |
            doow-track-${{ matrix.target }}
            doow-track-${{ matrix.target }}.sha256
          if-no-files-found: error

  smoke-windows:
    name: Smoke test Windows CLI binary
    needs: build-cli
    runs-on: windows-latest

    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cli-windows-x64.exe

      - name: Smoke test Windows CLI binary
        shell: pwsh
        run: |
          $binary = '.\doow-track-windows-x64.exe'
          $version = & $binary --version
          if ($version -notmatch '^doow-track v\d+\.\d+\.\d+$') { throw "Unexpected version output: $version" }
          $help = & $binary --help
          if ($help -notmatch 'Usage: doow-track') { throw 'Help output is missing CLI usage.' }
          $expectedHash = (Get-Content '.\doow-track-windows-x64.exe.sha256' -Raw).Split(' ')[0]
          $actualHash = (Get-FileHash $binary -Algorithm SHA256).Hash.ToLower()
          if ($actualHash -ne $expectedHash) { throw 'Windows CLI checksum does not match.' }
          $env:DOOW_TRACK_DISABLED = 'true'
          $env:DOOW_TRACK_INPUT = 'stdin'
          '{"metric":"release_smoke","quantity":1,"license_id":"lic_smoke"}' | & $binary --api-key dk_smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  release:
    name: GitHub Release with CLI binaries
    needs: [test, verify-version, build-docker, build-cli, smoke-windows]
    if: startsWith(github.ref, 'refs/tags/typescript-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: cli-*
          path: release-assets
          merge-multiple: true

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/typescript-v}" >> "$GITHUB_OUTPUT"

      - name: Upload release assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "@doow/track v${{ steps.version.outputs.version }}"
          generate_release_notes: true
          files: release-assets/*
