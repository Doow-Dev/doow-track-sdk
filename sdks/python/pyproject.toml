[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "doow-track"
version = "0.1.0"
description = "Official Doow SDK for Python - usage telemetry and management"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Doow", email = "support@doow.co" }
]
keywords = ["doow", "telemetry", "usage", "billing", "saas", "metering"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-httpx>=0.22.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.scripts]
doow-track = "doow_track.cli.main:main"

[project.urls]
Homepage = "https://doow.co"
Documentation = "https://docs.doow.co/sdks/python"
Repository = "https://github.com/Doow-Dev/doow-track-python"

[tool.hatch.build.targets.wheel]
packages = ["src/doow_track"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.9"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
