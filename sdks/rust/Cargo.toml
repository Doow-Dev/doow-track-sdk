[package]
name = "doow-track"
version = "0.1.0"
edition = "2021"
authors = ["Doow <support@doow.co>"]
description = "Official Doow SDK for Rust - usage telemetry and management"
license = "MIT"
repository = "https://github.com/Doow-Dev/doow-track-rust"
documentation = "https://docs.rs/doow-track"
keywords = ["doow", "telemetry", "usage", "tracking", "metering"]
categories = ["api-bindings", "web-programming"]

[dependencies]
reqwest = { version = "0.11", features = ["json", "gzip"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "fs", "io-util", "net", "signal", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "1"
tracing = "0.1"
flate2 = "1"
async-trait = "0.1"

[dev-dependencies]
tokio-test = "0.4"
wiremock = "0.5"
